name: Publish to npm

# Publishes @livx.cc/native-kit and @livx.cc/appwrap to the public npm registry on push to main.
# Auto-bump: if package.json's version is already on npm, the patch version is bumped,
# committed back to main with [skip ci], and that new version is published.
# A manual version bump in your commit is respected as-is (no double-bump).
# Bump uses `bun pm version` (not `npm version`) because the examples' package.json use
# `workspace:*` deps — npm's workspace-tree resolution chokes on that (EUNSUPPORTEDPROTOCOL),
# bun's doesn't. Publish stays on `npm publish` (proven working auth via NODE_AUTH_TOKEN) —
# `npm publish` doesn't walk the workspace graph so it never hits the workspace:* issue.
# Auth via NPM_TOKEN (an npm *automation* token — bypasses 2FA/OTP).
# The CLI's prepack (node scripts/stage-assets.mjs) bundles runtime/ + templates/ into its tarball.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish-native-kit:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/native-kit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Pull NPM_TOKEN from bodify secrets store
        # The npm token is NOT a per-repo secret — a repo-scoped NPM_TOKEN goes stale silently and every
        # publish then dies on a 404. Pull the canonical token from bodify at publish time, so rotating it
        # in ONE place fixes every repo. Only GitHub secret needed: BODIFY_API_KEY.
        env:
          BODIFY_API_KEY: ${{ secrets.BODIFY_API_KEY }}
        run: |
          TOKEN=$(curl -fsS -H "Authorization: Bearer $BODIFY_API_KEY" \
            "https://bodify.bod.ee/api/apps/9ddba0fb-03bc-4490-8577-5e094b5b6792/env/NPM_TOKEN?environment=prod" \
            | jq -r '.value')
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "::error::could not fetch NPM_TOKEN from bodify"; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "NODE_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Bump if needed, then publish
        env:
          NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already published — auto-bumping patch…"
            bun pm version patch --no-git-tag-version
            NEW_VERSION=$(node -p "require('./package.json').version")
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json
            git commit -m "chore(native-kit): auto-bump $NAME to $NEW_VERSION [skip ci]"
            git push origin HEAD:main
            echo "Publishing $NAME@$NEW_VERSION…"
            npm publish --access public
          else
            echo "Publishing $NAME@$VERSION…"
            npm publish --access public
          fi

  publish-cli:
    needs: publish-native-kit
    if: ${{ always() && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/appwrap-cli
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Pull NPM_TOKEN from bodify secrets store
        # The npm token is NOT a per-repo secret — a repo-scoped NPM_TOKEN goes stale silently and every
        # publish then dies on a 404. Pull the canonical token from bodify at publish time, so rotating it
        # in ONE place fixes every repo. Only GitHub secret needed: BODIFY_API_KEY.
        env:
          BODIFY_API_KEY: ${{ secrets.BODIFY_API_KEY }}
        run: |
          TOKEN=$(curl -fsS -H "Authorization: Bearer $BODIFY_API_KEY" \
            "https://bodify.bod.ee/api/apps/9ddba0fb-03bc-4490-8577-5e094b5b6792/env/NPM_TOKEN?environment=prod" \
            | jq -r '.value')
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "::error::could not fetch NPM_TOKEN from bodify"; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "NODE_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Bump if needed, then publish
        env:
          NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already published — auto-bumping patch…"
            bun pm version patch --no-git-tag-version
            NEW_VERSION=$(node -p "require('./package.json').version")
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json
            git commit -m "chore(cli): auto-bump $NAME to $NEW_VERSION [skip ci]"
            git push origin HEAD:main
            echo "Publishing $NAME@$NEW_VERSION… (prepack bundles runtime/ + templates/)"
            npm publish --access public
          else
            echo "Publishing $NAME@$VERSION… (prepack bundles runtime/ + templates/)"
            npm publish --access public
          fi
