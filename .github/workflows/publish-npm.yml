name: Publish to npm

# Publishes @livx.cc/native-kit and @livx.cc/appwrap to the public npm registry on push to main.
# Auto-bump: if package.json's version is already on npm, the patch version is bumped,
# committed back to main with [skip ci], and that new version is published.
# A manual version bump in your commit is respected as-is (no double-bump).
# Auth via NPM_TOKEN (an npm *automation* token — bypasses 2FA/OTP).
# The CLI's prepack (node scripts/stage-assets.mjs) bundles runtime/ + templates/ into its tarball.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish-native-kit:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/native-kit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Bump if needed, then publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          unset NPM_CONFIG_USERCONFIG  # bun doesn't expand env vars in setup-node's .npmrc; use ours
          echo "npmrc bytes: $(wc -c < .npmrc), token length: ${#NPM_TOKEN}, pwd: $(pwd)"
          bun pm whoami || echo "whoami failed (diagnostic only, continuing)"
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already published — auto-bumping patch…"
            bun pm version patch --no-git-tag-version
            NEW_VERSION=$(node -p "require('./package.json').version")
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json
            git commit -m "chore(native-kit): auto-bump $NAME to $NEW_VERSION [skip ci]"
            git push origin HEAD:main
            echo "Publishing $NAME@$NEW_VERSION…"
            bun publish --access public --verbose
          else
            echo "Publishing $NAME@$VERSION…"
            bun publish --access public --verbose
          fi

  publish-cli:
    needs: publish-native-kit
    if: ${{ always() && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/appwrap-cli
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Bump if needed, then publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          unset NPM_CONFIG_USERCONFIG  # bun doesn't expand env vars in setup-node's .npmrc; use ours
          echo "npmrc bytes: $(wc -c < .npmrc), token length: ${#NPM_TOKEN}, pwd: $(pwd)"
          bun pm whoami || echo "whoami failed (diagnostic only, continuing)"
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already published — auto-bumping patch…"
            bun pm version patch --no-git-tag-version
            NEW_VERSION=$(node -p "require('./package.json').version")
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json
            git commit -m "chore(cli): auto-bump $NAME to $NEW_VERSION [skip ci]"
            git push origin HEAD:main
            echo "Publishing $NAME@$NEW_VERSION… (prepack bundles runtime/ + templates/)"
            bun publish --access public --verbose
          else
            echo "Publishing $NAME@$VERSION… (prepack bundles runtime/ + templates/)"
            bun publish --access public --verbose
          fi
